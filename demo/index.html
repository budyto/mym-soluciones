<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo de tu web · MyM Soluciones</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../img/favicon-2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600;800&family=Playfair+Display:ital,wght@0,800;1,600&display=swap">
<style>
/* Demo web automática (MyM Soluciones, fase 3 del diagnóstico de redes, 16/11/2026).
   Se arma desde un JSON guardado en demos/{id} por el CRM. Modos: ?id=…, ?ejemplo y vista previa del CRM (postMessage).
   Todo el texto se escapa. Es una muestra: el cartel de arriba lo dice siempre. */
:root{ --fondo:#fff; --fondo2:#f5f8ff; --tinta:#0d1b3d; --gris:#55607a; --acento:#2f6bff; --acento2:#00c2a8; --oscuro:#0d1b3d; --sobreosc:#bff3ea; --linea:#dbe3f5;
  --fdisp:'Bricolage Grotesque',system-ui,sans-serif; --mayus:none; --pesodisp:800; color-scheme:light; }
.t-energia{ --fondo:#0b0b0d; --fondo2:#141418; --tinta:#f4f1ea; --gris:#a3a1a8; --acento:#ff5a1f; --acento2:#ffc531; --oscuro:#1a1a20; --sobreosc:#ffc531; --linea:#2a2a33; --fdisp:Anton,Impact,sans-serif; --mayus:uppercase; --pesodisp:400; color-scheme:dark; }
.t-bienestar{ --fondo:#fffdf9; --fondo2:#f6f1ea; --tinta:#2b2522; --gris:#6d655f; --acento:#c06a48; --acento2:#6f8466; --oscuro:#2b2522; --sobreosc:#f3d9c4; --linea:#e2d8ca; --fdisp:Fraunces,Georgia,serif; --pesodisp:700; }
.t-elegante{ --fondo:#fffcfa; --fondo2:#f6ece8; --tinta:#141214; --gris:#6c6468; --acento:#b8915a; --acento2:#141214; --oscuro:#141214; --sobreosc:#e9d6b4; --linea:#eadfd8; --fdisp:'Playfair Display',Georgia,serif; --pesodisp:800; }
.t-tecnico{ --fondo:#fbfdff; --fondo2:#e8f3fb; --tinta:#0b1530; --gris:#5f6b80; --acento:#1352c9; --acento2:#ff6a2b; --oscuro:#0a2f7a; --sobreosc:#5ec3f0; --linea:#d9e6f2; --fdisp:'Barlow Condensed',Impact,sans-serif; --mayus:uppercase; --pesodisp:800; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:var(--fondo); color:var(--tinta); font:16px/1.6 Inter,system-ui,sans-serif; }
.in{ max-width:1080px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
.disp,h1,h2{ font-family:var(--fdisp); text-transform:var(--mayus); font-weight:var(--pesodisp); line-height:1.02; text-wrap:balance; }
.aviso{ background:#111; color:#fff; font-size:13.5px; text-align:center; padding:8px 16px; }
.aviso a{ color:#9fe9de; font-weight:700; }
nav{ position:sticky; top:0; z-index:5; background:color-mix(in srgb,var(--fondo) 90%,transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--linea); }
nav .in{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding-block:12px; }
.logo{ font-family:var(--fdisp); text-transform:var(--mayus); font-weight:var(--pesodisp); font-size:22px; }
.logo span{ color:var(--acento); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:11px 22px; border-radius:999px; font-weight:800; text-decoration:none; background:var(--acento); color:#fff; border:2px solid var(--acento); }
.btn.sec{ background:transparent; color:var(--tinta); border-color:var(--linea); }
.btn:focus-visible{ outline:3px solid var(--acento2); outline-offset:2px; }
.hero{ padding-block:clamp(48px,9vw,96px); background:radial-gradient(900px 400px at 85% 0%, color-mix(in srgb,var(--acento) 22%,transparent), transparent), var(--fondo); }
.etiqueta{ font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--acento); }
h1{ font-size:clamp(40px,8vw,84px); margin:14px 0 18px; max-width:16ch; }
h1 em{ font-style:normal; color:var(--acento); }
.bajada{ font-size:clamp(17px,2.2vw,20px); color:var(--gris); max-width:58ch; margin-bottom:26px; }
.acciones{ display:flex; gap:10px; flex-wrap:wrap; }
section.bloque{ padding-block:64px; }
section.alt{ background:var(--fondo2); }
h2{ font-size:clamp(30px,5vw,48px); margin-bottom:26px; }
.grilla{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
.tarjeta{ background:var(--fondo); border:1px solid var(--linea); border-radius:18px; padding:22px; }
.alt .tarjeta{ background:var(--fondo); }
.tarjeta h3{ font-size:19px; margin-bottom:6px; }
.tarjeta p{ color:var(--gris); }
.tarjeta .precio{ display:block; font-family:var(--fdisp); font-weight:var(--pesodisp); font-size:28px; color:var(--acento); margin:6px 0; }
.num{ display:inline-grid; place-items:center; width:40px; height:40px; border-radius:50%; background:var(--acento); color:#fff; font-weight:800; margin-bottom:10px; }
.testi p{ color:var(--tinta); font-size:17px; }
.testi small{ color:var(--gris); display:block; margin-top:10px; }
.nota{ font-size:13px; color:var(--gris); margin-top:14px; }
details{ border-bottom:1px solid var(--linea); padding:18px 0; }
summary{ cursor:pointer; font-weight:800; font-size:17px; list-style:none; display:flex; justify-content:space-between; gap:16px; }
summary::after{ content:"+"; color:var(--acento); font-size:22px; line-height:1; }
details[open] summary::after{ content:"–"; }
details p{ color:var(--gris); margin-top:8px; }
.cierre{ background:var(--oscuro); color:#fff; text-align:center; padding-block:72px; }
.cierre h2{ color:#fff; } .cierre p{ color:#ffffffcc; max-width:56ch; margin:0 auto 24px; }
.cierre .btn{ background:var(--sobreosc); border-color:var(--sobreosc); color:#111; }
footer{ padding-block:26px 90px; color:var(--gris); font-size:14px; border-top:1px solid var(--linea); }
.wa{ position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); width:58px; height:58px; border-radius:50%; background:#25d366; display:grid; place-items:center; box-shadow:0 10px 26px -8px #25d366; z-index:6; }
.wa svg{ width:30px; height:30px; fill:#fff; }
#estado{ padding:80px 20px; text-align:center; color:#333; font-family:Inter,sans-serif; }
@media (max-width:600px){ section.bloque{ padding-block:48px; } }
</style>
</head>
<body>
<div id="estado" role="status">Cargando la demo…</div>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>window.FIREBASE_GRUPO={apiKey:"AIzaSyDTLcVzYxFdz5AOzq40zaMDHhvaKC0SW-I",authDomain:"grupo-mym-73b8d.firebaseapp.com",projectId:"grupo-mym-73b8d",appId:"1:966952304229:web:99501761762dfd290cd08c"}; /* Base del Grupo MyM (proyecto grupo-mym-73b8d): config pública, no es secreta. Ahí viven los pedidos, devoluciones y demos. */</script>
<script>
(function(){
'use strict';
var Q = new URLSearchParams(location.search), app = document.getElementById('app'), estado = document.getElementById('estado');
var TEMAS = ['soluciones','energia','bienestar','elegante','tecnico'];
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function md(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); }
function arr(x){ return Array.isArray(x) ? x : []; }
function soloNum(s){ return String(s || '').replace(/\D/g, ''); }
function waLink(num, txt){ num = soloNum(num); if (!num) return '#contacto'; if (num.length === 10) num = '549' + num; return 'https://wa.me/' + num + (txt ? '?text=' + encodeURIComponent(txt) : ''); }

function dibujar(D){
  var tema = TEMAS.indexOf(D.tema) >= 0 ? D.tema : 'soluciones';
  document.body.className = 't-' + tema;
  var h = D.hero || {}, c = D.contacto || {}, marca = D.marca || 'Tu negocio';
  document.title = marca + ' · Demo';
  var wa = waLink(c.whatsapp, 'Hola, vi su página y quiero más información.');
  var partes = String(marca).split(' ');
  var logo = partes.length > 1 ? esc(partes.slice(0, -1).join(' ')) + ' <span>' + esc(partes[partes.length - 1]) + '</span>' : esc(marca);
  var html = '';
  if (!Q.has('vista')) html += '<div class="aviso">Esta es una <b>demo</b> hecha por MyM Soluciones para ' + esc(marca) + '. <a href="https://wa.me/5491133662080?text=' + encodeURIComponent('Hola, vi la demo de la web de ' + marca + ' y la quiero.') + '" target="_blank" rel="noopener">La quiero para mi negocio →</a></div>';
  html += '<nav><div class="in"><div class="logo">' + logo + '</div><a class="btn" href="' + esc(wa) + '" target="_blank" rel="noopener">' + esc(h.cta || 'Escribinos') + '</a></div></nav>';
  html += '<header class="hero"><div class="in"><div class="etiqueta">' + esc(h.etiqueta || D.rubro || '') + '</div><h1>' + md(h.titulo || marca) + (h.destacado ? ' <em>' + esc(h.destacado) + '</em>' : '') + '</h1>' +
    (h.bajada ? '<p class="bajada">' + md(h.bajada) + '</p>' : '') + '<div class="acciones"><a class="btn" href="' + esc(wa) + '" target="_blank" rel="noopener">' + esc(h.cta || 'Escribinos por WhatsApp') + '</a>' +
    (arr(D.servicios).length ? '<a class="btn sec" href="#servicios">Ver ' + esc(D.palabraServicios || 'servicios') + '</a>' : '') + '</div></div></header>';
  if (arr(D.beneficios).length) html += '<section class="bloque"><div class="in"><h2>' + esc(D.tituloBeneficios || '¿Por qué elegirnos?') + '</h2><div class="grilla">' + arr(D.beneficios).map(function(b){ return '<div class="tarjeta"><h3>' + esc(b[0]) + '</h3><p>' + md(b[1]) + '</p></div>'; }).join('') + '</div></div></section>';
  if (arr(D.servicios).length) html += '<section class="bloque alt" id="servicios"><div class="in"><h2>' + esc(D.tituloServicios || 'Lo que ofrecemos') + '</h2><div class="grilla">' + arr(D.servicios).map(function(s){ return '<div class="tarjeta"><h3>' + esc(s[0]) + '</h3>' + (s[1] ? '<span class="precio">' + esc(s[1]) + '</span>' : '') + '<p>' + md(s[2]) + '</p></div>'; }).join('') + '</div>' + (D.notaPrecios ? '<p class="nota">' + md(D.notaPrecios) + '</p>' : '') + '</div></section>';
  if (arr(D.como).length) html += '<section class="bloque"><div class="in"><h2>' + esc(D.tituloComo || 'Cómo funciona') + '</h2><div class="grilla">' + arr(D.como).map(function(p, i){ return '<div class="tarjeta"><div class="num">' + (i + 1) + '</div><h3>' + esc(p[0]) + '</h3><p>' + md(p[1]) + '</p></div>'; }).join('') + '</div></div></section>';
  if (arr(D.testimonios).length) html += '<section class="bloque alt"><div class="in"><h2>Lo que dicen</h2><div class="grilla">' + arr(D.testimonios).map(function(t){ return '<div class="tarjeta testi"><p>“' + esc(t[0]) + '”</p><small>' + esc(t[1]) + '</small></div>'; }).join('') + '</div><p class="nota">Testimonios de ejemplo: en la web real van los de tus clientes, con su permiso.</p></div></section>';
  if (arr(D.faq).length) html += '<section class="bloque"><div class="in" style="max-width:820px"><h2>Preguntas frecuentes</h2>' + arr(D.faq).map(function(f){ return '<details><summary>' + esc(f[0]) + '</summary><p>' + md(f[1]) + '</p></details>'; }).join('') + '</div></section>';
  var ci = D.cierre || {};
  html += '<section class="cierre" id="contacto"><div class="in"><h2>' + md(ci.titulo || '¿Hablamos?') + '</h2>' + (ci.texto ? '<p>' + md(ci.texto) + '</p>' : '') + '<a class="btn" href="' + esc(wa) + '" target="_blank" rel="noopener">' + esc(ci.cta || 'Escribinos por WhatsApp') + '</a></div></section>';
  html += '<footer><div class="in">' + esc(marca) + [c.direccion, c.horario, c.instagram ? '@' + String(c.instagram).replace(/^@/, '') : ''].filter(Boolean).map(function(x){ return ' · ' + esc(x); }).join('') + '</div></footer>';
  html += '<a class="wa" href="' + esc(wa) + '" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.2-.7-2.7-1.1-4.4-3.9-4.6-4.1-.1-.2-1.1-1.4-1.1-2.7s.7-1.9.9-2.2c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.2 1.3z"/></svg></a>';
  app.innerHTML = html;
  estado.hidden = true;
}
function falla(t){ estado.hidden = false; estado.textContent = t; }

// Vista previa: la muestra el panel admin de esta misma web (admin/diagnosticos.html) en un recuadro.
// Solo se acepta contenido que venga de esta web.
if (Q.has('vista')){
  window.addEventListener('message', function(ev){
    if (ev.origin !== location.origin || !ev.data || ev.data.tipo !== 'demo') return;
    try { dibujar(ev.data.datos || {}); } catch (e) { falla('No se pudo dibujar la demo: ' + e.message); }
  });
  // Avisa que está lista (solo un aviso, sin datos): el CRM le manda el contenido.
  var dueno = window.opener || (window.parent !== window ? window.parent : null);
  if (dueno) dueno.postMessage({ tipo:'vista-lista' }, '*');
} else if (Q.has('ejemplo')){
  fetch('ejemplo.json').then(function(r){ return r.json(); }).then(dibujar).catch(function(){ falla('No se pudo cargar el ejemplo.'); });
} else if (Q.get('id') && /^[A-Za-z0-9_-]{16,64}$/.test(Q.get('id'))){
  var fb = firebase.initializeApp(window.FIREBASE_GRUPO, 'demo-publica'), db = fb.firestore();
  var ref = db.collection('demos').doc(Q.get('id'));
  ref.get().then(function(s){
    if (!s.exists) return falla('No encontramos esta demo. Escribinos al 11 3366-2080.');
    var x = s.data(), demo = x.demo || {};
    try { if (x.demoJson) demo = JSON.parse(x.demoJson); } catch (e) {}
    dibujar(demo);
    try { if (!sessionStorage.getItem('demo-' + s.id)) { sessionStorage.setItem('demo-' + s.id, '1');
      ref.update({ vistas: firebase.firestore.FieldValue.increment(1), vistoEn: firebase.firestore.FieldValue.serverTimestamp() }).catch(function(){}); } } catch (e) {}
  }).catch(function(){ falla('No pudimos abrir la demo. Probá en un rato o escribinos al 11 3366-2080.'); });
} else {
  falla('Para ver una demo necesitás el link que te mandamos.');
}
})();
</script>
</body>
</html>
