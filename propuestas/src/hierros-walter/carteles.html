<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<!-- Carteles QR de opiniones en Google para Hierros Walter y Todo Durlock (18/11/2026). 15 x 15 cm, para imprimir.
     Los QR abren la pantalla de opinión de cada ficha (writereview?placeid=...). Place ID verificados contra Google Maps. -->
<title>Carteles QR · Hierros Walter y Todo Durlock</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
@page{size:150mm 150mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#888}
.c{width:150mm;height:150mm;background:#fff;position:relative;overflow:hidden;page-break-after:always;break-after:page;margin:0 auto 6mm;display:flex;flex-direction:column;align-items:center;padding:9mm 10mm 7mm;text-align:center}
@media print{body{background:#fff}.c{margin:0}}
.c:before{content:"";position:absolute;inset:0 0 auto 0;height:4mm;background:linear-gradient(90deg,#4285f4 0 25%,#ea4335 25% 50%,#fbbc05 50% 75%,#34a853 75%)}
.sup{font:800 13pt Inter;color:#141414;letter-spacing:-.01em;margin-top:2mm}
.g{font:800 30pt/1 Inter;letter-spacing:-.03em;margin:1.5mm 0 .5mm}
.g .b{color:#4285f4}.g .r{color:#ea4335}.g .y{color:#fbbc05}.g .v{color:#34a853}
.est{color:#fbbc05;font-size:20pt;letter-spacing:1.5mm;line-height:1}
.qr{width:62mm;height:62mm;margin:4mm 0 3mm;padding:2.5mm;border:1.2mm solid #141414;border-radius:4mm}
.qr img{width:100%;height:100%;display:block}
.inst{font:600 10.5pt/1.3 Inter;color:#333}
.inst b{color:#141414}
.local{margin-top:auto;font:900 19pt/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em;color:#fff;padding:2mm 6mm;border-radius:2mm}
.h .local{background:#d9361e}
.d .local{background:#1d5fb8}
.gr{font:600 7pt Inter;color:#888;margin-top:2mm}
</style>
</head>
<body>
<section class="c h">
  <div class="sup">¿Lo atendimos bien?</div>
  <div class="g"><span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="v">l</span><span class="r">e</span></div>
  <div class="est">★★★★★</div>
  <div class="qr"><img src="qr-resena-hierros.svg" alt="QR para opinar sobre Hierros Walter en Google"></div>
  <div class="inst"><b>Escanee con la cámara del celular</b><br>y deje su opinión en un minuto.</div>
  <div class="local">Hierros Walter</div>
  <div class="gr">Gracias por elegirnos</div>
</section>
<section class="c d">
  <div class="sup">¿Lo atendimos bien?</div>
  <div class="g"><span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="v">l</span><span class="r">e</span></div>
  <div class="est">★★★★★</div>
  <div class="qr"><img src="qr-resena-durlock.svg" alt="QR para opinar sobre Todo Durlock en Google"></div>
  <div class="inst"><b>Escanee con la cámara del celular</b><br>y deje su opinión en un minuto.</div>
  <div class="local">Todo Durlock</div>
  <div class="gr">Gracias por elegirnos</div>
</section>
</body>
</html>
