<script>

    var mx = Math.max.apply(null, arr(p.items).map(function(i){ return Number(i[1]) || 0; }).concat([1]));

    '<div><div class="indice">' + S.filter(function(s){ return s.nombre; }).map(function(s){ return '<div><b>' + s.k + '</b>' + esc(s.nombre) + '</div>'; }).join('') + '</div>' +
    '<div class="firma">Preparado por MyM Soluciones · ' + esc(D.marca || '') + '</div></div>';
  // Contenido
  var nro = 2, actual = nuevaPagina(pie, nro);
  S.forEach(function(s, si){

        actual.cuerpo.removeChild(b); nro++; actual = nuevaPagina(pie, nro); actual.cuerpo.appendChild(b);
      }
    });
  });
  if (!actual.cuerpo.childNodes.length) hojas.removeChild(actual.pag.parentNode);
  // Cierre
  var ci = D.cierre || {};
  var fin = nuevaPagina('', 0); fin.pag.classList.add('final');
  var wa = txt((D.contacto || {}).whatsapp) || WA_SOLUCIONES;
  fin.pag.innerHTML = '<div class="tag">Próximo paso</div><div class="big">' + md(ci.titulo || 'Hagamos crecer tu negocio') + '</div>' +
    (ci.texto ? '<p style="font-size:11pt">' + md(ci.texto) + '</p>' : '') +
    '<p style="font-size:11pt;margin-top:3mm"><b>' + esc(ci.cta || '¿Lo hablamos esta semana?') + '</b></p>' +
    '<a class="wa" href="https://wa.me/' + esc(wa.replace(/\D/g, '')) + '">💬 Escribinos al WhatsApp</a>' +
    '<p style="font-size:8pt;margin-top:6mm;opacity:.8">MyM Soluciones · Parte del Grupo MyM · @mymsoluciones369</p>';
  document.getElementById('hablar').href = 'https://wa.me/' + wa.replace(/\D/g, '') + '?text=' + encodeURIComponent('Hola, leí el diagnóstico de redes de ' + (D.nombre || 'mi negocio') + ' y quiero hablar del próximo paso.');
  escalar();
  estado.hidden = true;
  if (FLAGS.length === 0) document.getElementById('barra').hidden = false;
}

/* En pantalla se achica para que entre en el ancho del celular; al imprimir vuelve al tamaño real. */
function escalar(){
  var ancho = 108 * 96 / 25.4, z = Math.min(1.25, (window.innerWidth - 24) / ancho);
  Array.prototype.forEach.call(document.querySelectorAll('.marco'), function(m){ m.style.zoom = z; });
}
window.addEventListener('resize', escalar);
window.addEventListener('beforeprint', function(){ Array.prototype.forEach.call(document.querySelectorAll('.marco'), function(m){ m.style.zoom = 1; }); });
window.addEventListener('afterprint', escalar);
document.getElementById('bajar').addEventListener('click', function(){ window.print(); });

// Sin titulo: un error de carga (texto suelto). Con titulo: la pantalla de «necesitás el link», con la marca y a dónde ir.
function falla(t, titulo, texto, ir, irTxt){
  estado.hidden = false;
  if (!titulo) { estado.textContent = t; return; }
  const e = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  estado.innerHTML = `<div class="vacio"><p class="marca"><b>MyM</b><span>SOLUCIONES</span></p><h1>${e(titulo)}</h1><p>${e(texto)}</p><a class="ir" href="${e(ir)}">${e(irTxt)}</a><a class="otro" href="https://wa.me/5491133662080" target="_blank" rel="noopener">Escribinos por WhatsApp</a></div>`;
}

/* ---------- de dónde salen los datos ---------- */
// Vista previa: la muestra el panel admin de esta misma web (admin/diagnosticos.html) en un recuadro.
// Solo se acepta contenido que venga de esta web.
if (Q.has('vista')){
  // Vista previa dentro del CRM: el CRM manda el JSON por postMessage (mismo origen).
  window.addEventListener('message', function(ev){
    if (ev.origin !== location.origin || !ev.data || ev.data.tipo !== 'devolucion') return;
    try { dibujar(ev.data.datos || {}); } catch (e) { falla('No se pudo dibujar la devolución: ' + e.message); }
  });
  // Avisa que está lista (solo un aviso, sin datos): el CRM le manda el contenido.
  var dueno = window.opener || (window.parent !== window ? window.parent : null);
  if (dueno) dueno.postMessage({ tipo:'vista-lista' }, '*');
} else if (Q.has('ejemplo')){
  fetch('ejemplo.json').then(function(r){ return r.json(); }).then(dibujar).catch(function(){ falla('No se pudo cargar el ejemplo.'); });
} else if (Q.get('id')){
  var id = Q.get('id');
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(id)) { falla('El link no es válido. Pedinos uno nuevo por WhatsApp al 11 3366-2080.'); }
  else {
    var app = firebase.initializeApp(window.FIREBASE_GRUPO, 'devolucion-publica'), db = app.firestore();
    var ref = db.collection('devoluciones').doc(id);
    ref.get().then(function(s){
      if (!s.exists) return falla('No encontramos este diagnóstico. Escribinos al 11 3366-2080 y te lo mandamos de nuevo.');
      var x = s.data(), dev = x.devolucion || {};
      try { if (x.devolucionJson) dev = JSON.parse(x.devolucionJson); } catch (e) {}
      dibujar(dev);
      // Contamos la visita una vez por sesión, para saber en el CRM si lo abrió.
      try {
        if (!sessionStorage.getItem('visto-' + id)) {
          sessionStorage.setItem('visto-' + id, '1');
          ref.update({ vistas: firebase.firestore.FieldValue.increment(1), vistoEn: firebase.firestore.FieldValue.serverTimestamp() }).catch(function(){});
        }
      } catch (e) {}
    }).catch(function(){ falla('No pudimos abrir el diagnóstico. Probá de nuevo en un rato o escribinos al 11 3366-2080.'); });
  }
} else {
  falla(null, "Este diagnóstico se abre con tu link", "Para ver un diagnóstico de redes necesitás el link que te mandamos por WhatsApp. Si todavía no tenés el tuyo, pedilo gratis.", "/diagnostico-redes/", "Pedir mi diagnóstico gratis");
}
window.__dibujarDevolucion = dibujar;
})();
</script>
