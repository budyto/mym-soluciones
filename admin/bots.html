<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bots de clientes · MyM Soluciones</title>
<meta name="robots" content="noindex, nofollow">
<!-- Panel de la plataforma de bots (14/11/2026, pedido de Matías). Solo entran las cuentas de SITE.adminEmails,
     con el mismo login de Google del panel (admin/acceso.js). El servidor de la plataforma vuelve a verificar el
     token de Google en cada pedido y tiene su propia lista (ADMIN_EMAILS). Acá está el único clic humano del
     recorrido: prender un bot que el cliente aprobó (modo espectador), o pausarlo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;900&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--azul:#2f6bff;--agua:#00c2a8;--deg:linear-gradient(120deg,#2f6bff,#00c2a8);--ink:#0e1a33;--gris:#4a5878;--borde:#dbe4f7;--suave:#eef3ff;--ok:#0a8a60;--aviso:#9a5c00;--mal:#c2364e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f4f7ff,#e6eeff) fixed;color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0}
header h1{font:900 24px Archivo;margin:0;letter-spacing:-.02em}
header a{color:var(--gris);text-decoration:none;font-weight:600}
.der{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--gris);font-size:14px}
.btn{border:0;border-radius:11px;padding:9px 14px;font:700 14px Archivo;cursor:pointer;background:var(--suave);color:var(--azul)}
.btn.principal{background:var(--deg);color:#fff}
.btn.mal{background:#fde9ed;color:var(--mal)}
.btn[disabled]{opacity:.6;cursor:progress}
.tarjeta{background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(23,48,120,.06),0 10px 26px -10px rgba(23,48,120,.18);padding:20px;margin-bottom:16px}
.puerta{max-width:420px;margin:12vh auto;text-align:center}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filtros button{border:1.5px solid var(--borde);background:#fff;border-radius:99px;padding:6px 12px;font:600 13.5px Archivo;cursor:pointer;color:var(--gris)}
.filtros button[aria-pressed=true]{border-color:var(--azul);color:var(--azul);background:var(--suave)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font:500 12px "Martian Mono",monospace;color:var(--gris);padding:8px;border-bottom:1px solid var(--borde)}
td{padding:10px 8px;border-bottom:1px solid #edf1fb;vertical-align:top}
tr.fila{cursor:pointer}tr.fila:hover td{background:#f8faff}
.estado{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.e-activo{background:#e2f6ee;color:var(--ok)}.e-revision{background:#fff3d9;color:var(--aviso)}.e-pausado,.e-pruebas{background:#fde9ed;color:var(--mal)}.e-otro{background:var(--suave);color:var(--gris)}
.gris{color:var(--gris)}.chica{font-size:13px}
pre{white-space:pre-wrap;font:12px/1.6 "Martian Mono",monospace;background:#f6f8fe;border-radius:12px;padding:12px;color:var(--gris);max-height:320px;overflow:auto}
dl{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;margin:0;font-size:14.5px}dt{color:var(--gris)}dd{margin:0}
.prueba{padding:8px 0;border-top:1px solid #edf1fb;font-size:14px}
.error{color:var(--mal);font-size:14px}
@media(max-width:700px){dl{grid-template-columns:1fr}.ocultar-cel{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="puerta" class="tarjeta puerta" hidden>
    <h1 style="font:900 22px Archivo;margin:0 0 6px">Bots de clientes</h1>
    <p class="gris">Entrá con tu cuenta de Google autorizada.</p>
    <p class="error" id="msj-puerta"></p>
    <button class="btn principal" id="entrar">Entrar con Google</button>
  </div>

  <div id="panel" hidden>
    <header><a href="./">← Inicio del panel</a><h1>Bots de clientes</h1><div class="der"><span id="quien"></span><button class="btn" id="salir">Salir</button></div></header>
    <div class="tarjeta">
      <div class="filtros" id="filtros">
        <button data-f="revision" aria-pressed="true">Para revisar</button><button data-f="activo" aria-pressed="false">Andando</button><button data-f="pausado" aria-pressed="false">Pausados</button><button data-f="todos" aria-pressed="false">Todos</button>
      </div>
      <p class="error" id="error"></p>
      <table><thead><tr><th>Negocio</th><th>Estado</th><th class="ocultar-cel">WhatsApp</th><th class="ocultar-cel">Pruebas</th><th class="ocultar-cel">IA usada</th><th class="ocultar-cel">Alta</th></tr></thead><tbody id="tabla"><tr><td colspan="6" class="gris">Cargando…</td></tr></tbody></table>
    </div>
    <div id="detalle"></div>
  </div>
</div>
<script src="../config.js?v=202611142100"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" integrity="sha384-AQ3POAMqIhwS81FrUH95ekxqBZHeP5tG2JfEL3+7GuTtfRLWnrRh32UxwzM+//A9" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" integrity="sha384-TnlRYaR4JYz/lpaGuaiU61PjNberSA4vjLjtF+oRC/IkohkJqnWxw5EmDSOt1vA1" crossorigin="anonymous"></script>
<script src="acceso.js"></script>
<script>
(function () {
  const API = String((window.SITE || {}).plataformaApi || '').replace(/\/+$/, '');
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const pesos = (n) => '$ ' + Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 2 });
  const fecha = (iso) => iso ? new Date(iso).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }) : '';
  const NOMBRE = { whatsapp: 'Falta conectar WhatsApp', relevamiento: 'Completando su ficha', pruebas: 'Una prueba falló', aprobar: 'Esperando que apruebe', revision: 'Para revisar', activo: 'Andando', pausado: 'Pausado' };
  const clase = (e) => ({ activo: 'e-activo', revision: 'e-revision', pausado: 'e-pausado', pruebas: 'e-pruebas' })[e] || 'e-otro';
  let clientes = []; let filtro = 'revision';

  async function api(ruta, cuerpo) {
    const r = await fetch(API + ruta, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + await ACCESO.token() }, body: JSON.stringify(cuerpo || {}) });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { ACCESO.salir('Tu sesión venció o esa cuenta no tiene acceso.'); throw new Error('sin acceso'); }
    if (!r.ok) throw new Error(d.error || 'No se pudo completar.');
    return d;
  }
  async function cargar() {
    try { clientes = (await api('/api/admin/clientes')).clientes; dibujar(); $('#error').textContent = ''; }
    catch (e) { $('#error').textContent = e.message; }
  }
  function dibujar() {
    const lista = clientes.filter((c) => filtro === 'todos' || c.estado === filtro);
    $('#tabla').innerHTML = lista.map((c) => `<tr class="fila" data-id="${esc(c.id)}"><td><b>${esc(c.negocio)}</b><div class="gris chica">${esc(c.contacto)} · ${esc(c.email)}</div></td><td><span class="estado ${clase(c.estado)}">${esc(NOMBRE[c.estado] || c.estado)}</span></td><td class="ocultar-cel">${esc(c.numero || '—')}</td><td class="ocultar-cel">${esc(c.pruebas || '—')}</td><td class="ocultar-cel">${c.ia ? pesos(c.ia.gastado) + ' · ' + (c.ia.mensajes || 0) + ' msj' : '—'}</td><td class="ocultar-cel gris chica">${fecha(c.creado)}</td></tr>`).join('')
      || `<tr><td colspan="6" class="gris">${filtro === 'revision' ? 'No hay bots para revisar.' : 'No hay clientes en este grupo.'}</td></tr>`;
    document.querySelectorAll('tr.fila').forEach((tr) => (tr.onclick = () => verCliente(tr.dataset.id)));
  }
  document.querySelectorAll('#filtros button').forEach((b) => (b.onclick = () => { filtro = b.dataset.f; document.querySelectorAll('#filtros button').forEach((x) => x.setAttribute('aria-pressed', x === b)); dibujar(); }));

  async function verCliente(id) {
    $('#detalle').innerHTML = '<div class="tarjeta gris">Cargando…</div>';
    try {
      const { cliente: c, eventos } = await api('/api/admin/cliente', { id });
      const f = c.ficha || c.borrador || {};
      const boton = c.estado === 'activo' ? '<button class="btn mal" id="pausar">Pausar el bot</button>' : (['revision', 'pausado'].includes(c.estado) ? '<button class="btn principal" id="prender">Prender el bot</button>' : '<span class="gris chica">Se puede prender cuando el cliente lo aprueba.</span>');
      $('#detalle').innerHTML = `<div class="tarjeta">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h2 style="font:900 22px Archivo;margin:0">${esc(c.negocio)}</h2><span class="estado ${clase(c.estado)}">${esc(NOMBRE[c.estado] || c.estado)}</span><div style="margin-left:auto">${boton}</div></div>
        <p class="error" id="error-det"></p>
        <dl>
          <dt>Contacto</dt><dd>${esc(c.contacto)} · ${esc(c.email)} · ${esc(c.celular)}</dd>
          <dt>Plan</dt><dd>${esc(c.plan)}</dd>
          <dt>WhatsApp</dt><dd>${esc(c.whatsapp ? (c.whatsapp.numero || 'conectado') + (c.whatsapp.registrado === false ? ' (falta registrar el número)' : '') : 'sin conectar')}</dd>
          <dt>IA</dt><dd>${esc(f.modelo === 'economico' ? 'Económica' : 'Recomendada')} · ${c.ia ? pesos(c.ia.gastado) + ' usados de ' + pesos(c.ia.tope) + ' · ' + (c.ia.mensajes || 0) + ' mensajes' : '—'}</dd>
          <dt>Cobro</dt><dd>${esc(c.cobro ? (c.cobro.estado + (c.cobro.medio ? ' · ' + c.cobro.medio : '')) : '—')}</dd>
        </dl>
        ${c.pruebas ? `<h3 style="margin:18px 0 4px">Pruebas: ${c.pruebas.aprobadas} de ${c.pruebas.total}</h3>${c.pruebas.resultados.map((r) => `<div class="prueba">${r.ok ? '✓' : '✗'} <b>${esc(r.pregunta)}</b><br><span class="gris">${esc(r.respuesta)}</span>${r.ok ? '' : `<br><span class="error">${esc(r.motivo)}</span>`}</div>`).join('')}` : ''}
        <h3 style="margin:18px 0 4px">Ficha del negocio</h3><pre>${esc(Object.entries(f).map(([k, v]) => k + ': ' + v).join('\n'))}</pre>
        ${c.bot ? `<details><summary class="gris">Instrucciones que recibe la IA (versión ${esc(c.bot.version)})</summary><pre>${esc(c.bot.instrucciones)}</pre></details>` : ''}
        <h3 style="margin:18px 0 4px">Lo que pasó</h3><pre>${esc(eventos.map((e) => fecha(e.cuando) + '  ' + e.que).join('\n') || 'Sin novedades.')}</pre>
      </div>`;
      const cambiar = async (estado) => { try { await api('/api/admin/estado', { id, estado }); await cargar(); verCliente(id); } catch (e) { $('#error-det').textContent = e.message; } };
      if ($('#prender')) $('#prender').onclick = (e) => { e.target.disabled = true; cambiar('activo'); };
      if ($('#pausar')) $('#pausar').onclick = (e) => { e.target.disabled = true; cambiar('pausado'); };
      $('#detalle').scrollIntoView({ behavior: 'smooth' });
    } catch (e) { $('#detalle').innerHTML = `<div class="tarjeta error">${esc(e.message)}</div>`; }
  }

  $('#entrar').onclick = () => ACCESO.entrar();
  $('#salir').onclick = () => ACCESO.salir('');
  ACCESO.iniciar({
    alEntrar(u) { $('#puerta').hidden = true; $('#panel').hidden = false; $('#quien').textContent = u.email; cargar(); },
    alSalir(m) { $('#panel').hidden = true; $('#puerta').hidden = false; $('#msj-puerta').textContent = m || ''; }
  });
})();
</script>
</body>
</html>
