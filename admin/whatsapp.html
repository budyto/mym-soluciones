<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const API = String((window.SITE || {}).ventasApi || 'https://mym-creditos-81440681742.southamerica-east1.run.app').replace(/\/+$/, '');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fecha = (ts) => { const d = new Date(ts); return isNaN(d) ? '' : d.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
  const DE = { cliente: '', robot: 'Robot', humano: 'Equipo' };
  const TITULO = document.title;
  const CAMPOS = { nombre: 'Nombre', negocio: 'Negocio', rubro: 'Rubro', automatizar: 'Qué quiere automatizar', email: 'Email', ciudad: 'Ciudad' };
  // Los nombres de etapas los manda el server; éstos son sólo por si todavía no llegaron.
  let ETAPAS = { nuevo: 'Nuevo', diagnostico: 'Diagnóstico', propuesta: 'Propuesta', cliente: 'Cliente', perdido: 'Perdido' };
  // Los textos de los motivos son de la pantalla (Budy: "no se entendía qué quería decir cada uno").
  const MOTIVOS = { diagnostico: 'Quiere el diagnóstico', precio: 'Pide precio especial', contratar: 'Quiere contratar', persona: 'Pidió hablar con una persona', consulta: 'Consulta sin respuesta' };
  let campos = Object.keys(CAMPOS), respuestas = [], resumen = {}, pausado = false;
  let charlas = [], abierta = null, filtro = 'todas', etapa = '', vistos = null, nuevos = 0, fichaSucia = '', fichaAbierta = false;

  // 12/11/2026: se entra con Google (acceso.js). Cada pedido lleva el token de Google y el server de MyM
  // verifica la cuenta. Antes era una clave compartida guardada en la pestaña.
  async function pedir(ruta, op) {
    const r = await fetch(API + ruta, { ...(op || {}), headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + await ACCESO.token() } });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { salir('El server no aceptó tu cuenta. Volvé a entrar.'); throw new Error('sin acceso'); }
    if (!r.ok) { const e = new Error(j.error || 'HTTP ' + r.status); e.status = r.status; throw e; }
    return j;
  }
  const post = (ruta, cuerpo) => pedir(ruta, { method: 'POST', body: JSON.stringify(cuerpo) });
  const ruta = (t, extra) => '/api/ventas-sol/charlas/' + encodeURIComponent(t) + (extra || '');
  function msg(t) { $('#wamsg').innerHTML = t ? '<span class="err">' + esc(t) + '</span>' : ''; }
  function mostrarEntrada(m) { $('#panel').hidden = true; $('#entrar').hidden = false; $('#entrarmsg').textContent = m || ''; }
  function salir(m) { ACCESO.salir(m); }

  const nombre = (c) => (c.datos || {}).nombre || c.nombre_perfil || '+' + c.telefono;
  const minDesde = (ts) => ts ? Math.max(0, Math.round((Date.now() - new Date(ts)) / 60000)) : null;
  const hace = (min) => min < 1 ? 'recién' : min < 60 ? 'hace ' + min + ' min' : min < 1440 ? 'hace ' + Math.floor(min / 60) + ' h' : 'hace ' + Math.floor(min / 1440) + ' d';
  const esperando = (c) => !!c.espera_desde && !c.resuelta;
  // Avatar con iniciales, igual que en AppMyM: Meta no da la foto de perfil, sólo el nombre.
  function avatar(c, s) {
    const n = String(nombre(c)).trim();
    const ini = n.replace(/[^\p{L}\s]/gu, '').trim().split(/\s+/).slice(0, 2).map((w) => w[0] || '').join('').toUpperCase() || '?';
    let h = 0; for (const ch of String(c.telefono || n)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const col = ['#1565c0', '#6a1b9a', '#2e7d32', '#8e5b00', '#00695c', '#4527a0', '#ad1457', '#37474f'][h % 8];
    return '<span class="wa-avatar" style="width:' + s + 'px;height:' + s + 'px;background:' + col + ';font-size:' + Math.round(s * 0.4) + 'px">' + esc(ini) + '</span>';
  }

  // ---------- Barra y estado ----------
  function pintarBarra() {
    const esp = resumen.esperando != null ? resumen.esperando : charlas.filter(esperando).length;
    const tomadas = charlas.filter((c) => !c.robot_activo).length;
    $('#waSems').innerHTML = (esp ? '<button type="button" class="wa-sem wa-sem-al" id="semEsp"><i class="wa-dot"></i><span>🙋 ' + esp + (esp === 1 ? ' persona espera' : ' personas esperan') + ' a alguien del equipo</span></button>' : '')
      + (pausado ? '<span class="wa-sem"><i class="wa-dot" style="background:#ffb74d"></i><span>Bot pausado</span></span>' : '<span class="wa-sem"><i class="wa-dot"></i><span>Bot activo</span></span>')
      + (tomadas ? '<span class="wa-sem"><i class="wa-dot" style="background:#ffb74d"></i><span>' + tomadas + ' tomada' + (tomadas === 1 ? '' : 's') + ' por el equipo</span></span>' : '');
  }
  function pintarEstado() {
    const r = resumen, pe = r.por_etapa || {};
    $('#waDetalle').innerHTML = '<h3>Actividad</h3><div class="tarjetas">'
      + [[r.charlas_hoy, 'Conversaciones hoy'], [r.charlas_semana, 'Esta semana'], [r.nuevas_semana, 'Contactos nuevos (7 días)'], [r.esperando, 'Esperando respuesta', 'alerta']]
        .map(([n, t, k]) => '<div class="tarj ' + (k && n ? k : '') + '"><b>' + (n || 0) + '</b><small>' + t + '</small></div>').join('')
      + '</div><h3>Embudo</h3>' + Object.keys(ETAPAS).map((k) => '<div class="embudo-f" data-etapa="' + esc(k) + '"><span>' + esc(ETAPAS[k]) + '</span><b>' + (pe[k] || 0) + '</b></div>').join('');
  }
  async function cargarResumen() {
    try {
      const j = await pedir('/api/ventas-sol/resumen');
      if (j.etapas) ETAPAS = j.etapas;
      resumen = j.resumen || {};
      pausado = !!(j.robot_pausado ?? resumen.robot_pausado);
      $('#pausar').innerHTML = pausado ? '▶️<span class="wa-lbl"> Prender bot</span>' : '⏸️<span class="wa-lbl"> Pausar bot</span>';
      pintarBarra(); pintarEstado(); pintarTabs();
    } catch (e) { /* el resumen no es imprescindible: la lista sigue andando */ }
  }
  async function cargarRespuestas() {
    try {
      const j = await pedir('/api/ventas-sol/respuestas');
      respuestas = j.respuestas || [];
      if (j.etapas) ETAPAS = j.etapas;
      if (Array.isArray(j.campos_ficha) && j.campos_ficha.length) campos = j.campos_ficha;
      if (abierta) pintarChat();
    } catch (e) {}
  }

  // ---------- Lista ----------
  const FILTRO = {
    todas: () => true,
    esperando,
    pausadas: (c) => !c.robot_activo,
    sin_leer: (c) => c.sin_leer > 0,
    resueltas: (c) => !!c.resuelta,
  };
  function pintarTabs() {
    const n = (f) => charlas.filter(FILTRO[f]).length;
    const tab = (f, txt, cls) => '<button type="button" class="wa-tab ' + (cls || '') + (filtro === f && !etapa ? ' on' : '') + '" data-filtro="' + f + '">' + txt + '</button>';
    const porEtapa = {}; charlas.forEach((c) => { const k = c.etapa || 'nuevo'; porEtapa[k] = (porEtapa[k] || 0) + 1; });
    // Igual que en AppMyM: un chip que diría 0 no se muestra.
    $('#waTabs').innerHTML = tab('todas', 'Todos · ' + charlas.length)
      + (n('esperando') ? tab('esperando', '🙋 Piden humano · ' + n('esperando'), 'rojo') : '')
      + (n('pausadas') ? tab('pausadas', '✋ Tomadas por el equipo · ' + n('pausadas'), 'naranja') : '')
      + (n('sin_leer') ? tab('sin_leer', 'Sin leer · ' + n('sin_leer')) : '')
      + (n('resueltas') ? tab('resueltas', '✓ Ya atendidas · ' + n('resueltas')) : '')
      + Object.keys(ETAPAS).filter((k) => porEtapa[k]).map((k) => '<button type="button" class="wa-tab' + (etapa === k ? ' on' : '') + '" data-etapa="' + esc(k) + '">' + esc(ETAPAS[k]) + ' · ' + porEtapa[k] + '</button>').join('');
  }
  function pintarCharlas() {
    pintarTabs(); pintarBarra();
    const q = $('#wabuscar').value.trim().toLowerCase();
    let lista = charlas.filter((c) => (etapa ? (c.etapa || 'nuevo') === etapa : FILTRO[filtro](c)))
      .filter((c) => !q || [c.datos.nombre, c.datos.negocio, c.nombre_perfil, c.telefono].join(' ').toLowerCase().includes(q));
    // En "Piden humano" manda la espera: primero el que hace más que espera.
    if (filtro === 'esperando' && !etapa) lista = lista.slice().sort((a, b) => String(a.espera_desde).localeCompare(String(b.espera_desde)));
    $('#waLista').innerHTML = lista.length ? lista.map((c) => {
      const d = c.datos || {}, ult = c.ultimo || {}, minUlt = minDesde(ult.ts), minEsp = esperando(c) ? minDesde(c.espera_desde) : null;
      const nueva = (c.etapa || 'nuevo') === 'nuevo' && minDesde(c.creado) != null && minDesde(c.creado) < 1440;
      return '<div class="wa-item' + (abierta && abierta.telefono === c.telefono ? ' on' : '') + (c.resuelta ? ' resuelta' : '') + '" data-tel="' + esc(c.telefono) + '">'
        + avatar(c, 38)
        + '<div class="wa-cuerpo"><div class="wa-l1"><span class="wa-nom">' + esc(nombre(c)) + '</span>'
        + (minUlt != null ? '<span class="wa-hora' + (minUlt > 1440 ? ' viejo' : '') + '">' + hace(minUlt) + '</span>' : '') + '</div>'
        + '<div class="wa-bajo"><div class="wa-txts">'
        + '<div class="wa-ult">' + (ult.de && ult.de !== 'cliente' ? (ult.de === 'robot' ? 'Robot: ' : 'Vos: ') : '') + esc(ult.texto || '') + '</div>'
        + '<div class="wa-etapa">' + [ETAPAS[c.etapa || 'nuevo'] || 'Nuevo', d.negocio, d.automatizar].filter(Boolean).map(esc).join(' · ') + '</div>'
        + (c.derivada && !c.resuelta ? '<div class="wa-motivo' + (minEsp > 30 ? ' tarde' : '') + '">🙋 ' + esc(MOTIVOS[c.derivada.motivo] || 'Derivada') + (minEsp != null ? ' · espera ' + hace(minEsp) : '') + '</div>' : '')
        + '</div><div class="wa-ests">'
        + (c.sin_leer ? '<i class="cont">' + c.sin_leer + '</i>' : '')
        + (minEsp != null ? '<i class="urg" title="Espera a alguien del equipo">🙋</i>' : '')
        + (nueva ? '<i class="new" title="Contacto nuevo (últimas 24 h)">NEW</i>' : '')
        + (!c.robot_activo ? '<i title="La atiende el equipo; el robot no contesta">👤</i>' : '')
        + (!c.sin_leer && ult.de === 'cliente' ? '<i class="leido" title="Leído">✓✓</i>' : '')
        + (!c.ventana_abierta ? '<i title="Ventana de 24 h cerrada: no se le puede escribir">🔒</i>' : '')
        + '</div></div></div></div>';
    }).join('') : '<div class="vacio-lista">No hay conversaciones con este filtro.</div>';
  }

  // ---------- Charla y ficha ----------
  function pintarChat() {
    $('#waWrap').classList.toggle('abierta', !!abierta);
    if (!abierta) { $('#waChat').innerHTML = '<div class="vacio">Elegí una conversación de la lista.</div>'; return; }
    const c = abierta;
    const borrador = $('#texto') ? $('#texto').value : '';
    const fichaVieja = fichaSucia === c.telefono ? $('#waFicha') : null;
    $('#waChat').innerHTML = '<div class="wa-cab"><button class="btn gris solo-cel" id="volver" type="button">←</button>' + avatar(c, 40)
      + '<div class="quien"><b>' + esc(nombre(c)) + '</b><small>+' + esc(c.telefono) + ((c.datos || {}).negocio ? ' · ' + esc(c.datos.negocio) : '') + '</small>'
      + (c.derivada ? '<small class="der">El robot la derivó: ' + esc((MOTIVOS[c.derivada.motivo] || c.derivada.motivo).toLowerCase()) + ' · ' + fecha(c.derivada.ts) + '</small>' : '') + '</div>'
      + '<div class="wa-acc">'
      + (c.robot_activo ? '<button class="btn" id="robot" type="button" title="El robot deja de contestar en esta charla">✋ Tomar la charla</button>' : '<button class="btn gris" id="robot" type="button" title="El robot vuelve a contestar en esta charla">🤖 Devolver al robot</button>')
      + (c.resuelta ? '<button class="btn gris" id="resolver" type="button" title="Vuelve a Esperando">Reabrir</button>' : '<button class="btn gris" id="resolver" type="button" title="Sale de Esperando hasta que vuelva a escribir">✓ Ya la atendí</button>')
      + '<button class="btn gris" id="verficha" type="button" aria-expanded="' + fichaAbierta + '">📋 Ficha</button></div></div>'
      + '<div class="wa-burbujas scroll" id="msgs">' + (c.mensajes || []).map((m) => '<div class="wa-b wa-' + esc(m.de) + '">' + esc(m.texto) + '<span class="wa-t">' + (DE[m.de] ? DE[m.de] + ' · ' : '') + fecha(m.ts)
      + (m.error ? ' · <span class="err">no salió: ' + esc(m.error) + '</span>' : '') + '</span></div>').join('') + '</div>'
      + (c.ultimo_error ? '<p class="err" style="margin:0;font-size:12px">Último error de envío: ' + esc(c.ultimo_error) + '</p>' : '')
      + (c.ventana_abierta
        ? (respuestas.length ? '<div class="rapidas">' + respuestas.map((r, i) => '<button type="button" data-rapida="' + i + '" title="' + esc(r.texto) + '">' + esc(r.titulo) + '</button>').join('') + '</div>' : '')
          + '<form class="escribir" id="escribir"><textarea id="texto" rows="1" placeholder="Escribile desde el 11 3366-2080…" required></textarea><button class="btn" type="submit" style="padding:10px 16px">Enviar</button></form>'
        : '<div class="cerrada"><b>🔒 Ventana de 24 h cerrada.</b> Pasaron más de 24 horas desde su último mensaje: WhatsApp no permite escribirle hasta que el contacto vuelva a escribir.</div>')
      + '<aside id="waFicha" class="scroll"' + (fichaAbierta ? '' : ' hidden') + '></aside>';
    if (borrador && $('#texto')) $('#texto').value = borrador;
    const msgs = $('#msgs'); msgs.scrollTop = msgs.scrollHeight;
    // Con cambios sin guardar se vuelve a poner la misma ficha: el refresco no pisa lo que se está escribiendo.
    if (fichaVieja) { $('#waFicha').replaceWith(fichaVieja); fichaVieja.hidden = !fichaAbierta; $('#fichamsg').textContent = 'Cambios sin guardar.'; return; }
    fichaSucia = '';
    const d = c.datos || {};
    $('#waFicha').innerHTML = '<div class="tit"><h2>Ficha</h2><button class="btn gris" id="cerrarficha" type="button" title="Cerrar">✕</button></div><form id="fichaform">'
      + '<label>Etapa<select name="etapa">' + Object.keys(ETAPAS).map((k) => '<option value="' + esc(k) + '"' + ((c.etapa || 'nuevo') === k ? ' selected' : '') + '>' + esc(ETAPAS[k]) + '</option>').join('') + '</select></label>'
      + campos.map((k) => '<label>' + esc(CAMPOS[k] || k) + '<input name="d_' + esc(k) + '" value="' + esc(d[k] || '') + '"></label>').join('')
      + '<label>Notas internas (el cliente no las ve)<textarea name="notas">' + esc(c.notas || '') + '</textarea></label>'
      + '<button class="btn" type="submit" style="justify-content:center;padding:9px">Guardar</button><p id="fichamsg"></p></form>'
      + '<div class="dato"><span>Primer contacto: ' + (fecha(c.creado) || '—') + '</span><span>Último mensaje del cliente: ' + (fecha(c.ultimo_cliente_en) || '—') + '</span></div>';
  }

  async function cargar() {
    try { charlas = (await pedir('/api/ventas-sol/charlas')).charlas || []; msg(''); avisar(); pintarCharlas(); }
    catch (e) { msg('No se pudieron leer las conversaciones: ' + e.message); }
  }
  async function abrir(t) {
    try {
      abierta = (await pedir(ruta(t))).charla;
      const c = charlas.find((x) => x.telefono === t); if (c) c.sin_leer = 0;
      if (vistos) vistos[t] = firma(abierta);
      pintarCharlas(); pintarChat();
    } catch (e) { msg('No se pudo abrir la conversación: ' + e.message); }
  }
  function refrescarCharla(c) { const i = charlas.findIndex((x) => x.telefono === c.telefono); if (i >= 0) charlas[i] = { ...charlas[i], ...c, mensajes: undefined }; abierta = { ...abierta, ...c }; pintarCharlas(); pintarChat(); }

  // ---------- Avisos: título "(3) WhatsApp…" y notificación del navegador ----------
  const firma = (c) => ((c.ultimo || {}).ts || '') + '|' + (c.derivada ? c.derivada.ts : '');
  function avisar() {
    const ahora = {};
    charlas.forEach((c) => { ahora[c.telefono] = firma(c); });
    if (vistos) {
      const derivoRecien = (c) => c.derivada && !(vistos[c.telefono] || '').endsWith('|' + c.derivada.ts);
      const cambios = charlas.filter((c) => vistos[c.telefono] !== ahora[c.telefono] && ((c.ultimo || {}).de === 'cliente' || derivoRecien(c)));
      if (cambios.length) {
        nuevos += cambios.length;
        if (window.Notification && Notification.permission === 'granted') {
          const c = cambios[0];
          try { new Notification(derivoRecien(c) ? 'Derivación: ' + nombre(c) : 'Mensaje de ' + nombre(c), { body: (c.ultimo || {}).texto || '', icon: '../img/favicon.png', tag: 'wa-' + c.telefono }); } catch (e) {}
        }
      }
    }
    vistos = ahora;
    const pend = charlas.reduce((n, c) => n + (c.sin_leer || 0), 0) || nuevos;
    document.title = (pend ? '(' + pend + ') ' : '') + TITULO;
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { nuevos = 0; tick(); } });
  if (window.Notification && Notification.permission === 'default') $('#avisos').hidden = false;
  $('#avisos').addEventListener('click', () => Notification.requestPermission().then(() => { $('#avisos').hidden = Notification.permission !== 'default'; }));

  // ---------- Eventos ----------
  // whatsapp.html#tel=549... abre esa charla directo (lo usan los links del inicio).
  const telDelLink = () => (String(location.hash).match(/tel=(\d{6,15})/) || [])[1] || '';
  function entrar() {
    $('#entrar').hidden = true; $('#panel').hidden = false; cargarResumen(); cargarRespuestas();
    cargar().then(() => { const t = telDelLink(); if (t) { abrir(t); history.replaceState(null, '', location.pathname); } });
  }
  function filtrar(f, e) { filtro = f; etapa = e || ''; pintarCharlas(); }
  $('#entrar').addEventListener('submit', (e) => { e.preventDefault(); $('#entrarmsg').textContent = 'Abriendo Google…'; ACCESO.entrar(); });
  $('#salir').addEventListener('click', () => salir(''));
  $('#wabuscar').addEventListener('input', pintarCharlas);
  $('#warecargar').addEventListener('click', () => { cargarResumen(); cargar(); if (abierta) abrir(abierta.telefono); });
  // Pausa global (31/10/2026): con el robot pausado los mensajes entran sin leer y nadie contesta solo.
  $('#pausar').addEventListener('click', async (e) => {
    const b = e.currentTarget;
    if (!pausado && !confirm('¿Pausar el robot en TODAS las charlas? Los mensajes van a quedar sin respuesta hasta que lo prendas.')) return;
    b.disabled = true;
    try { pausado = !!(await post('/api/ventas-sol/robot', { activo: pausado })).robot_pausado; await cargarResumen(); }
    catch (err) { msg('No se pudo cambiar el robot: ' + err.message); }
    b.disabled = false;
  });
  $('#verEstado').addEventListener('click', (e) => { const d = $('#waDetalle'); d.hidden = !d.hidden; e.currentTarget.setAttribute('aria-expanded', String(!d.hidden)); });
  document.addEventListener('click', (e) => { if (!e.target.closest('#waDetalle, #verEstado')) $('#waDetalle').hidden = true; });
  $('#waDetalle').addEventListener('click', (e) => { const f = e.target.closest('[data-etapa]'); if (f) { filtrar('todas', f.dataset.etapa); $('#waDetalle').hidden = true; } });
  $('#waSems').addEventListener('click', (e) => { if (e.target.closest('#semEsp')) filtrar('esperando'); });
  $('#waTabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; b.dataset.etapa ? filtrar('todas', etapa === b.dataset.etapa ? '' : b.dataset.etapa) : filtrar(b.dataset.filtro); });
  $('#waLista').addEventListener('click', (e) => { const it = e.target.closest('[data-tel]'); if (it) abrir(it.dataset.tel); });

  $('#waChat').addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b || !abierta) return;
    if (b.id === 'volver') { abierta = null; pintarCharlas(); pintarChat(); return; }
    if (b.id === 'verficha' || b.id === 'cerrarficha') { fichaAbierta = b.id === 'verficha' ? !fichaAbierta : false; $('#waFicha').hidden = !fichaAbierta; $('#verficha').setAttribute('aria-expanded', fichaAbierta); return; }
    if (b.dataset.rapida != null) {
      const t = $('#texto'), r = respuestas[+b.dataset.rapida]; if (!t || !r) return;
      const i = t.selectionStart ?? t.value.length;
      t.value = t.value.slice(0, i) + r.texto + t.value.slice(t.selectionEnd ?? i); t.focus(); return;
    }
    if (b.id !== 'robot' && b.id !== 'resolver') return;
    b.disabled = true;
    try {
      if (b.id === 'robot') { await post(ruta(abierta.telefono, '/robot'), { activo: !abierta.robot_activo }); await abrir(abierta.telefono); }
      else refrescarCharla((await post(ruta(abierta.telefono, '/resolver'), { resuelta: !abierta.resuelta })).charla);
      cargar(); cargarResumen();
    } catch (err) { b.disabled = false; msg('No se pudo cambiar: ' + err.message); }
  });
  $('#waChat').addEventListener('input', (e) => {
    if (e.target.id === 'texto') { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; return; }
    if (abierta && e.target.closest('#waFicha')) { fichaSucia = abierta.telefono; $('#fichamsg').textContent = 'Cambios sin guardar.'; }
  });
  $('#waChat').addEventListener('keydown', (e) => { if (e.target.id === 'texto' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#escribir').requestSubmit(); } });
  $('#waChat').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (e.target.id === 'fichaform') return guardarFicha(e.target);
    const texto = $('#texto').value.trim(), boton = e.target.querySelector('button');
    if (!texto || !abierta) return;
    boton.disabled = true;
    try { await post(ruta(abierta.telefono, '/responder'), { texto }); $('#texto').value = ''; await abrir(abierta.telefono); cargar(); }
    catch (err) {
      boton.disabled = false;
      if (err.status === 409) { abierta.ventana_abierta = false; pintarChat(); msg('La ventana de 24 h está cerrada: no se puede escribirle hasta que vuelva a escribir.'); }
      else msg('No se pudo mandar: ' + err.message);
    }
  });
  async function guardarFicha(f) {
    if (!abierta) return;
    const d = abierta.datos || {}, datos = {}, cuerpo = {};
    campos.forEach((k) => { const v = f['d_' + k].value.trim(); if (v !== (d[k] || '')) datos[k] = v; });
    if (Object.keys(datos).length) cuerpo.datos = datos;
    if (f.etapa.value !== (abierta.etapa || 'nuevo')) cuerpo.etapa = f.etapa.value;
    if (f.notas.value.trim() !== (abierta.notas || '')) cuerpo.notas = f.notas.value.trim();
    if (!Object.keys(cuerpo).length) { fichaSucia = ''; $('#fichamsg').textContent = 'No hay cambios.'; return; }
    const b = f.querySelector('button'); b.disabled = true;
    try { const ch = (await post(ruta(abierta.telefono, '/ficha'), cuerpo)).charla; fichaSucia = ''; refrescarCharla(ch); $('#fichamsg').textContent = 'Guardado.'; if (cuerpo.etapa) cargarResumen(); }
    catch (err) { b.disabled = false; $('#fichamsg').innerHTML = '<span class="err">No se pudo guardar: ' + esc(err.message) + '</span>'; }
  }

  // Cada 20 s y sólo con la pestaña visible: cada vuelta son lecturas pagas de Firestore en MyM.
  // Mientras se escribe un mensaje no se refresca la charla; la ficha se cuida sola (fichaSucia).
  function tick() {
    if (document.hidden || $('#panel').hidden) return;
    cargar(); cargarResumen();
    const foco = document.activeElement;
    if (abierta && !(foco && foco.id === 'texto')) abrir(abierta.telefono);
  }
  setInterval(tick, 20000);
  ACCESO.iniciar({ alEntrar: () => { if ($('#panel').hidden) entrar(); }, alSalir: mostrarEntrada });
})();
</script>
</body>
</html>
